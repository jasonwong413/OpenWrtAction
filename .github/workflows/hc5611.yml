name: Build HC5611 firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget jq zstd ca-certificates patch
          df -h .
      - name: Build and verify the image
        run: |
          sed -i '/feeds install -a/a rm -f package/feeds/luci/luci-app-weechat' build-hc5611.sh
          printf '%s\n' CONFIG_PACKAGE_kmod-mt7603=y CONFIG_PACKAGE_wpad-basic-mbedtls=y CONFIG_PACKAGE_kmod-usb2=y CONFIG_PACKAGE_kmod-usb-ohci=y CONFIG_LUCI_LANG_zh_Hans=y >> hc5611.config
          sed -i s/CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=256/CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=1024/ hc5611.config
          OPENWRT_BUILD_DIR="$RUNNER_TEMP/hc5611-openwrt" bash -x build-hc5611.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hc5611-firmware
          path: firmware/
          if-no-files-found: error
